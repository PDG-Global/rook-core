[server]
listen = "127.0.0.1:8080"
max_connections = 4096
max_connections_per_ip = 256
max_connections_per_upstream = 1024
max_upstream_per_ip = 64
max_tracked_clients = 10000
requests_per_second = 100
request_burst = 200
max_header_bytes = 32768
max_request_body_bytes = 1048576
header_read_timeout = 10
request_timeout = 30
upstream_connect_timeout = 5
idle_timeout = 60
websocket_idle_timeout = 300
websocket_max_lifetime = 3600
shutdown_drain = 15
# Proxies we run that faithfully pass on the visitor's address (via
# X-Forwarded-For). A host allowed through the firewall but not listed here
# reaches Rook as itself and cannot claim another identity through headers.
trusted_proxies = []
# The subset permitted to speak CF-Connecting-IP on the visitor's behalf
# (Cloudflare edge ranges). Members are also trusted for X-Forwarded-For.
# CF-Connecting-IP is never forwarded upstream; upstreams read X-Real-IP or
# X-Forwarded-For instead.
cloudflare_ranges = []

# Operational metrics (plan section 8): a second listener serving
# Prometheus-text counters on GET /metrics. Loopback only — a
# non-loopback listen address is a config error, hostnames do not
# resolve here, and the proxy refuses to dial the listener, so a route
# or tunnel can never publish /metrics. Scrapes are not counted as
# requests. Off by default.
# [metrics]
# enabled = false
# listen = "127.0.0.1:9188"

[[sites]]
hosts = ["example.com"]
# Upstream response headers that would normally be stripped because
# they disclose the backend ("server", "x-powered-by"). List one here
# only when the app legitimately surfaces its own. Default: strip all.
# preserve_upstream_headers = []

[[sites.routes]]
prefix = "/"
upstreams = ["http://127.0.0.1:9000"]
websocket = true
origins = []
allow_remote_http = false
